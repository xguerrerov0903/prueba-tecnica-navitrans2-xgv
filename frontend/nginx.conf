# ============================================================
# frontend/nginx.conf — Arranque Seguro
#
# Configura nginx como:
#   1. Servidor de estáticos SPA (React + Vite)
#   2. Reverse Proxy para /api/ → backend:8000
#
# Esta configuración reemplaza en producción al proxy de Vite
# definido en vite.config.ts (que sólo aplica en desarrollo).
# ============================================================

server {
    listen 80;

    # ----------------------------------------------------------
    # Reverse Proxy: todas las peticiones /api/ → backend
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass          http://backend:8000/api/;

        # Cabeceras estándar de proxy
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;

        # Crítico: preservar Content-Disposition para la descarga del .zip
        # (el frontend lee el filename del ZIP desde esta cabecera)
        proxy_pass_header   Content-Disposition;

        # Timeouts razonables para generación de documentos
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ----------------------------------------------------------
    # SPA routing: sirve index.html para rutas del cliente
    # ----------------------------------------------------------
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Soporte para client-side routing de React Router / SPA
        # Si el recurso no existe como archivo/directorio, sirve index.html
        try_files $uri $uri/ /index.html;
    }
}
